name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore Dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore

      - name: Run Unit Tests
        # One test module at a time: the net10.0 and net11.0 mDNS tests interfere with each other on the network when run in parallel
        run: dotnet test --no-build --no-restore --verbosity normal --coverage --coverage-output-format cobertura --max-parallel-test-modules 1
